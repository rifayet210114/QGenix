<!-- QGenix Favicon — AI Brain Circuit icon on purple-to-blue gradient rounded square -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Brand gradient: purple (#8B5CF6) → blue (#3B82F6) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Brain / circuit icon (simplified BrainCircuit from Lucide) — white, centered -->
  <g transform="translate(14, 14)" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Brain outline (left hemisphere) -->
    <path d="M18 2a6 6 0 0 0-6 6c0 1.5.6 2.8 1.5 3.8A5 5 0 0 0 10 16a5 5 0 0 0 2 4 5 5 0 0 0-1 3c0 2.8 2.2 5 5 5h2V2h-0z"/>
    <!-- Brain outline (right hemisphere) -->
    <path d="M18 2a6 6 0 0 1 6 6c0 1.5-.6 2.8-1.5 3.8A5 5 0 0 1 26 16a5 5 0 0 1-2 4 5 5 0 0 1 1 3c0 2.8-2.2 5-5 5h-2V2h0z"/>
    <!-- Circuit lines inside the brain -->
    <line x1="14" y1="10" x2="18" y2="10"/>
    <line x1="18" y1="10" x2="22" y2="10"/>
    <line x1="14" y1="16" x2="18" y2="16"/>
    <line x1="18" y1="16" x2="22" y2="16"/>
    <line x1="14" y1="22" x2="18" y2="22"/>
    <line x1="18" y1="22" x2="22" y2="22"/>
    <!-- Circuit nodes (small dots at endpoints) -->
    <circle cx="12" cy="10" r="1.2" fill="white" stroke="none"/>
    <circle cx="24" cy="10" r="1.2" fill="white" stroke="none"/>
    <circle cx="12" cy="16" r="1.2" fill="white" stroke="none"/>
    <circle cx="24" cy="16" r="1.2" fill="white" stroke="none"/>
    <circle cx="12" cy="22" r="1.2" fill="white" stroke="none"/>
    <circle cx="24" cy="22" r="1.2" fill="white" stroke="none"/>
    <!-- Vertical brain stem -->
    <line x1="18" y1="28" x2="18" y2="34"/>
    <circle cx="18" cy="35" r="1.2" fill="white" stroke="none"/>
  </g>
</svg>